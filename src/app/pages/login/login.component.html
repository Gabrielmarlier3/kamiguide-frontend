<div
  class="from-background via-background to-muted flex min-h-screen items-center justify-center bg-gradient-to-br p-4"
>
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <h1 class="text-primary mb-2 text-4xl font-bold">KamiGuide</h1>
      <p class="text-muted-foreground">Your anime companion</p>
    </div>

    <div class="border-border w-full max-w-md rounded-lg border">
      <div class="space-y-1 p-6">
        <h2 class="text-2xl font-bold">Welcome back</h2>
        <p class="text-muted-foreground text-sm">Enter your credentials to access your account</p>
      </div>

      <form class="space-y-4 p-6" (ngSubmit)="submit()">
        <div class="space-y-2">
          <label for="email" class="text-sm">Email</label>
          <input
            id="email"
            type="email"
            class="border-border bg-background h-10 w-full rounded border px-3"
            placeholder="your@email.com"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="isLoading"
          />
        </div>

        <div class="space-y-2">
          <label for="password" class="text-sm">Password</label>
          <input
            id="password"
            type="password"
            class="border-border bg-background h-10 w-full rounded border px-3"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
            [disabled]="isLoading"
          />
        </div>

        @if (error) {
          <p class="text-destructive text-sm">{{ error }}</p>
        }

        <div class="flex flex-col gap-4 p-6 pt-0">
          <button
            type="submit"
            class="bg-primary text-primary-foreground h-10 w-full rounded disabled:opacity-50"
            [disabled]="isLoading"
          >
            {{ isLoading ? 'Signing in...' : 'Sign in' }}
          </button>
          <p class="text-muted-foreground text-center text-sm">
            Don't have an account?
            <a routerLink="/signup" class="text-primary hover:underline">Sign up</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
