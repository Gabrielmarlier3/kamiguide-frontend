<div class="from-background via-background to-muted min-h-[90vh] bg-gradient-to-br">
  <app-header></app-header>

  <main class="mx-auto max-w-md px-4 py-12">
    <div class="mb-8 text-center">
      <h1 class="text-foreground mb-2 text-3xl font-bold">Reset your password</h1>
      <p class="text-muted-foreground">Enter the verification code and set a new password</p>
    </div>

    <div class="border-border rounded-lg border p-6">
      <form class="space-y-4" (ngSubmit)="submit()">
        <div>
          <label class="mb-2 block text-sm">Email</label>
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            class="bg-background border-border h-10 w-full rounded border px-3"
            required
            [disabled]="isLoading"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm">Verification code</label>
          <input
            [(ngModel)]="token"
            name="token"
            type="text"
            inputmode="numeric"
            placeholder="e.g. 182469"
            class="bg-background border-border h-10 w-full rounded border px-3"
            required
            [disabled]="isLoading"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm">New password</label>
          <input
            [(ngModel)]="newPassword"
            name="newPassword"
            type="password"
            minlength="8"
            maxlength="20"
            placeholder="New password"
            class="bg-background border-border h-10 w-full rounded border px-3"
            required
            [disabled]="isLoading"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm">Confirm new password</label>
          <input
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            type="password"
            minlength="8"
            maxlength="20"
            placeholder="Repeat new password"
            class="bg-background border-border h-10 w-full rounded border px-3"
            required
            [disabled]="isLoading"
          />
          @if (newPassword && confirmPassword && !passwordsMatch()) {
            <p class="text-destructive mt-1 text-xs">Passwords do not match.</p>
          }
        </div>

        @if (error) {
          <p class="text-destructive text-sm">{{ error }}</p>
        }
        @if (info) {
          <p class="text-sm text-green-400">{{ info }}</p>
        }

        <button
          type="submit"
          class="bg-primary text-primary-foreground h-10 w-full rounded disabled:opacity-50"
          [disabled]="isLoading || !email || !token || !passwordsMatch()"
        >
          {{ isLoading ? 'Saving...' : 'Change password' }}
        </button>

        <div class="mt-2 text-center">
          <a routerLink="/login" class="text-primary text-sm hover:underline">Back to login</a>
        </div>
      </form>
    </div>
  </main>
  <app-footer></app-footer>
</div>
