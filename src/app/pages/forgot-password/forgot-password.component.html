<app-header></app-header>
<div
  class="from-background via-background to-muted flex min-h-[88vh] items-center justify-center bg-gradient-to-br"
>
  <main class="w-full max-w-md px-4 py-12">
    <div class="mb-8 text-center">
      <h1 class="text-foreground mb-2 text-3xl font-bold">Forgot your password?</h1>
      <p class="text-muted-foreground">Enter your email to receive a verification code</p>
    </div>

    <div class="border-border rounded-lg border p-6">
      <form class="space-y-4" (ngSubmit)="submit()">
        <div>
          <label class="mb-2 block text-sm">Email</label>
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            class="bg-background border-border h-10 w-full rounded border px-3"
            required
            [disabled]="isLoading"
          />
        </div>

        @if (error) {
          <p class="text-destructive text-sm">{{ error }}</p>
        }
        @if (info) {
          <p class="text-sm text-green-400">{{ info }}</p>
        }

        <button
          type="submit"
          class="bg-primary text-primary-foreground h-10 w-full rounded disabled:opacity-50"
          [disabled]="isLoading || !email"
        >
          {{ isLoading ? 'Sending...' : 'Send recovery code' }}
        </button>

        <div class="mt-2 text-center">
          <a routerLink="/login" class="text-primary text-sm hover:underline">Back to login</a>
        </div>
      </form>
    </div>
  </main>
</div>
<app-footer></app-footer>
