<app-header></app-header>
<section class="py-12 px-4 sm:px-6 lg:px-8">
  <div class="container mx-auto">
    <div class="text-center mb-12">
      <div class="relative inline-block mb-8">
        <h1 class="text-2xl font-bold text-foreground">GENRES</h1>
        <div class="absolute -bottom-2 left-0 right-0 h-0.5 bg-primary"></div>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @if(loading) {
        <p class="text-center col-span-4 text-muted-foreground">Loading...</p>
      } @else {
      @for (genre of genres; track genre.genre) {
        <a
          [routerLink]="['/explore', genre.genre]"
          class="group"
        >
          <div
            class="relative aspect-[3/4] overflow-hidden rounded-lg cursor-pointer transition-transform duration-300 hover:scale-105"
          >
            <img
              [src]="genre.image || '/placeholder.svg'"
              [alt]="genre.genre + ' genre background'"
              class="absolute inset-0 w-full h-full object-cover"
            />

            <div
              class="absolute inset-0 bg-black/60 group-hover:bg-black/50 transition-colors duration-300"
            ></div>

            <div
              class="absolute inset-0 flex flex-col items-center justify-center text-white"
            >
              <lucide-angular
                [name]="iconMap[genre.genre] || 'help-circle'"
                class="h-8 w-8 mb-3 group-hover:scale-110 transition-transform duration-300"
              ></lucide-angular>
              <h3
                class="text-sm font-bold uppercase tracking-wider text-center px-2"
              >
                {{ genre.genre }}
              </h3>
            </div>
          </div>
        </a>
      }
    }
    </div>
  </div>
</section>
<app-footer></app-footer>
