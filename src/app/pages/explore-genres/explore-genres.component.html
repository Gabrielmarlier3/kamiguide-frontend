<app-header></app-header>
<section class="px-4 py-12 sm:px-6 lg:px-8">
  <div class="container mx-auto">
    <div class="mb-12 text-center">
      <div class="relative mb-8 inline-block">
        <h1 class="text-foreground text-2xl font-bold">GENRES</h1>
        <div class="bg-primary absolute right-0 -bottom-2 left-0 h-0.5"></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">
      @if (loading) {
        <p class="text-muted-foreground col-span-4 text-center">Loading...</p>
      } @else {
        @for (genre of genres; track genre.genre) {
          <a [routerLink]="['/explore', genre.genre]" class="group">
            <div
              class="relative aspect-[3/4] cursor-pointer overflow-hidden rounded-lg transition-transform duration-300 hover:scale-105"
            >
              <img
                [src]="genre.image || '/placeholder.svg'"
                [alt]="genre.genre + ' genre background'"
                class="absolute inset-0 h-full w-full object-cover"
              />

              <div
                class="absolute inset-0 bg-black/60 transition-colors duration-300 group-hover:bg-black/50"
              ></div>

              <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
                <lucide-angular
                  [name]="iconMap[genre.genre] || 'help-circle'"
                  class="mb-3 h-8 w-8 transition-transform duration-300 group-hover:scale-110"
                ></lucide-angular>
                <h3 class="px-2 text-center text-sm font-bold tracking-wider uppercase">
                  {{ genre.genre }}
                </h3>
              </div>
            </div>
          </a>
        }
      }
    </div>
  </div>
</section>
<app-footer></app-footer>
