<section class="py-12">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="mb-2 text-2xl font-bold">Staff Recommendations</h2>
    <p class="text-1xl mb-10">Handpicked anime that we think you'll absolutely love</p>
    @if (loading) {
      <p class="text-muted-foreground">Loading...</p>
    } @else {
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        @for (anime of staffRecommendation; track anime.mal_id) {
          <a
            [routerLink]="['/anime', anime.mal_id]"
            class="group bg-card border-border block overflow-hidden rounded-lg border transition-transform hover:scale-105 hover:shadow-lg"
          >
            <div class="aspect-[3/4] overflow-hidden">
              <img
                [src]="anime.image_url"
                [alt]="anime.title"
                class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-110"
              />
            </div>
            <div class="p-4">
              <div class="flex items-center justify-between">
                <h3 class="text-card-foreground group-hover:text-primary font-semibold">
                  {{ anime.title }}
                </h3>
                <span class="text-sm font-medium text-yellow-500"> ⭐ {{ anime.score }} </span>
              </div>
              <div class="mt-2 flex flex-wrap gap-2">
                @for (genre of anime.genres; track genre.mal_id) {
                  <span class="bg-secondary text-secondary-foreground rounded-md px-2 py-1 text-xs">
                    {{ genre.name }}
                  </span>
                }
              </div>
            </div>
          </a>
        }
      </div>
    }
  </div>
</section>
