<nav
  class="border-border bg-background/95 supports-[backdrop-filter]:bg-background/60 sticky top-0 z-50 w-full border-b backdrop-blur"
>
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo / Brand -->
      <div class="flex items-center gap-8">
        <a routerLink="/">
          <h1 class="text-primary text-2xl font-bold">KamiGuide</h1>
        </a>
        <div class="hidden items-center gap-6 md:flex">
          <a
            routerLink="/"
            class="text-muted-foreground hover:text-foreground text-sm font-medium transition-colors"
          >
            Home
          </a>
          <a
            routerLink="/explore"
            class="text-muted-foreground hover:text-foreground text-sm font-medium transition-colors"
          >
            Explore
          </a>
          <a
            routerLink="/calendar"
            class="text-muted-foreground hover:text-foreground text-sm font-medium transition-colors"
          >
            Calendar
          </a>
          <a
            routerLink="/community"
            class="text-muted-foreground hover:text-foreground text-sm font-medium transition-colors"
          >
            Join Community
          </a>
        </div>
      </div>

      <!-- Right side - Search + Profile -->
      <div class="flex items-center gap-4">
        <!-- Search -->
        <form (ngSubmit)="handleSearch($event)" class="relative hidden sm:block">
          <lucide-angular
            name="search"
            class="text-muted-foreground absolute top-1/2 left-1.5 h-4 w-4 -translate-y-1/2"
          ></lucide-angular>

          <input
            type="text"
            placeholder="Search anime..."
            class="bg-card border-border text-foreground placeholder:text-muted-foreground h-9 w-64 rounded-md border px-3 pl-10 text-sm"
            [(ngModel)]="searchQuery"
            name="search"
          />
        </form>

        @if (isAuth$ | async) {
          <div class="group relative">
            <button
              type="button"
              class="focus-visible:ring-ring hover:bg-accent/20 inline-flex h-9 w-9 items-center justify-center rounded-md text-green-400 transition-colors"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <lucide-angular name="user" class="h-6 w-6"></lucide-angular>
            </button>

            <!-- Dropdown -->
            <div
              role="menu"
              class="bg-card border-border invisible absolute top-full right-0 mt-2 w-40 rounded-md border opacity-0 shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 before:absolute before:-top-2 before:left-0 before:h-2 before:w-full before:content-[''] focus-within:visible focus-within:opacity-100 hover:visible hover:opacity-100"
            >
<!--              <button-->
<!--                role="menuitem"-->
<!--                class="text-foreground hover:bg-accent/20 block w-full px-4 py-2 text-left text-sm outline-none"-->
<!--                (click)="goToPreferences()"-->
<!--              >-->
<!--                Preferences-->
<!--              </button>-->
              <button
                role="menuitem"
                class="text-foreground hover:bg-accent/20 block w-full px-4 py-2 text-left text-sm outline-none"
                (click)="logout()"
              >
                Logout
              </button>
            </div>
          </div>
        } @else {
          <a
            routerLink="/login"
            class="bg-primary hover:bg-primary/90 inline-flex h-9 items-center justify-center rounded px-3 text-sm font-medium text-white"
          >
            Sign in
          </a>
        }
      </div>
    </div>
  </div>
</nav>
